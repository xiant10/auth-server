# Reviewed list of first-party OAuth clients.
clients:
  - id: t10-mac-client
    name: t10 for Mac
    type: public
    # Native clients listen on an ephemeral loopback port, so any port matches.
    redirect_uris:
      - http://127.0.0.1/callback
    idle_ttl: 720h
    absolute_ttl: 2160h
  - id: t10-mobile
    name: t10 mobile app
    type: public
    # The only client allowed to take a password itself.
    direct_login: true
    idle_ttl: 2160h
  # The property employee mini-program. It proves who it is with WeChat's login code,
  # and a week without use comes back to the password.
  - id: t10-miniprogram
    name: 物业员工端
    type: public
    wechat: true
    wechat_demo: true
    idle_ttl: 168h
  - id: t10-workbench
    name: Workbench
    type: confidential
    tenant: required
    # Confidential clients match exactly, so each deployment lists its own.
    redirect_uris:
      - http://127.0.0.1:8083/auth/callback
      - http://127.0.0.1:18060/auth/callback
      - http://127.0.0.1:28060/auth/callback
    # The hash of the dev secret in workbench's .env.example. Replace it outside
    # local development.
    secret_sha256: 3b2a1c8150447544142ed749be66a8a5cc8c4c25a0fb17e9b5e596313775cd11
    idle_ttl: 12h
    absolute_ttl: 168h
  - id: t10-property-web
    name: Property
    type: confidential
    tenant: required
    redirect_uris:
      - http://127.0.0.1:18075/auth/callback
    # The hash of a dev secret, "t10-property-web-dev-secret". Replace it outside local development.
    secret_sha256: 989c446dbbbd589c7365d8a21f8ba12bc20d4e76b42efe92eadfae4056755826
    idle_ttl: 12h
    absolute_ttl: 168h
  - id: t10-console
    name: Platform console
    type: confidential
    # Its routes check the platform role, and no tenant's policy should stop it.
    tenant: none
    redirect_uris:
      - http://127.0.0.1:8086/auth/callback
      - http://127.0.0.1:18020/auth/callback
      - http://127.0.0.1:18086/auth/callback
      - http://127.0.0.1:28020/auth/callback
    # The hash of a dev secret. Replace it outside local development.
    secret_sha256: 9563997683bc03b226cf8fff630944ac87aa2dfa0699a2a2025677582821359c
    # Shorter than the workbench's, because this is an operator tool.
    idle_ttl: 1h
    absolute_ttl: 12h

# What each stable runtime may ask for on a user's behalf. Secrets are in the
# database: every entry needs `authctl service-add`, or the server won't start.
runtimes:
  - name: t10-livekit-agent
    # Room admission creates this runtime's grant for each call.
    voice: true
    # A call's grant is the parent of agent-pi's, so it has to hold whatever a
    # tool needs, or the tool disappears on calls.
    actions: [agent:use, work:read, work:write, knowledge:read, property:read, property:propose]
    audiences: [agent-pi, agent-sales, t10-collab, t10-knowledge, t10-property, ai-gateway-tools]
  - name: agent-pi
    actions: [agent:use, work:read, work:write, knowledge:read, property:read, property:propose]
    audiences: [agent-pi, t10-collab, t10-knowledge, t10-property, ai-gateway-tools]
    # Where AUTH_TOOL_GATEWAY is on, its tokens are good only at the gateway.
    tool_audience: ai-gateway-tools
  - name: agent-sales
    actions: [agent:use, work:read, work:write, knowledge:read]
    audiences: [agent-sales, t10-collab, t10-knowledge, ai-gateway-tools]
    tool_audience: ai-gateway-tools
  # The Rust harness, serving the `ti` pool. Optional, as agent-ti is an
  # optional component: a deployment without it needs no account.
  - name: agent-ti
    optional: true
    actions: [agent:use, work:read, work:write, knowledge:read, property:read, property:propose]
    audiences: [agent-ti, t10-collab, t10-knowledge, t10-property, ai-gateway-tools]
    tool_audience: ai-gateway-tools
  # The property agent agent-ti hosts beside ti. A runtime of its own, so a token
  # names exactly one agent, and the gateways apply property's tool lists and
  # policy to its runs, not ti's. Optional, as agent-ti is.
  - name: agent-ti-property
    optional: true
    actions: [agent:use, knowledge:read, property:read, property:propose]
    audiences: [agent-ti-property, t10-knowledge, t10-property, ai-gateway-tools]
    tool_audience: ai-gateway-tools
  # Property's assistant: it turns a person's live token into a grant for their
  # conversation, after checking and cleaning what they typed. Its account is the
  # service account it already has.
  - name: t10-property
    optional: true
    actions: [agent:use, knowledge:read, property:read, property:propose]
    # agent-ti-property, so the property agent's runtime may build on its grants.
    audiences: [ai-gateway, agent-ti, agent-ti-property, t10-knowledge, t10-property, ai-gateway-tools]
  # Fires automations: it holds a person's standing grant, and makes one child
  # per firing for the harness it calls, through ai-gateway-agent, which has to
  # accept the firing's token. Its account exists only where setup has
  # T10_AUTOMATIONS_SECRET.
  - name: t10-automations
    optional: true
    actions: [agent:use, work:read, work:write, knowledge:read, property:read, property:propose]
    audiences: [ai-gateway, agent-pi, agent-sales, t10-collab, t10-knowledge, t10-property, ai-gateway-tools]

# Services that may exchange a run's token for one with another audience on
# its grant: the tool gateway, which forwards each tool call to its module with
# a token only that module accepts.
exchangers: [ai-gateway-tools]
