# Reviewed list of first-party OAuth clients.
clients:
  - id: t10-mac-client
    name: t10 for Mac
    type: public
    # Native clients listen on an ephemeral loopback port, so any port matches.
    redirect_uris:
      - http://127.0.0.1/callback
    idle_ttl: 720h
    absolute_ttl: 2160h
  - id: t10-mobile
    name: t10 mobile app
    type: public
    # The only client allowed to take a password itself.
    direct_login: true
    idle_ttl: 2160h
  - id: t10-workbench
    name: Workbench
    type: confidential
    tenant: required
    # Confidential clients match exactly, so each deployment lists its own.
    redirect_uris:
      - http://127.0.0.1:8083/auth/callback
      - http://127.0.0.1:18060/auth/callback
      - http://127.0.0.1:28060/auth/callback
    # The hash of the dev secret in workbench's .env.example. Replace it outside
    # local development.
    secret_sha256: 3b2a1c8150447544142ed749be66a8a5cc8c4c25a0fb17e9b5e596313775cd11
    idle_ttl: 12h
    absolute_ttl: 168h
  - id: t10-console
    name: Platform console
    type: confidential
    # Its routes check the platform role, and no tenant's policy should stop it.
    tenant: none
    redirect_uris:
      - http://127.0.0.1:8086/auth/callback
      - http://127.0.0.1:18020/auth/callback
      - http://127.0.0.1:18086/auth/callback
      - http://127.0.0.1:28020/auth/callback
    # The hash of a dev secret. Replace it outside local development.
    secret_sha256: 9563997683bc03b226cf8fff630944ac87aa2dfa0699a2a2025677582821359c
    # Shorter than the workbench's, because this is an operator tool.
    idle_ttl: 1h
    absolute_ttl: 12h

# What each stable runtime may ask for on a user's behalf. Secrets are in the
# database: every entry needs `authctl service-add`, or the server won't start.
runtimes:
  - name: t10-livekit-agent
    # Room admission creates this runtime's grant for each call. Without
    # LIVEKIT_* voice is off, and this account isn't needed either.
    voice: true
    # A call's grant is the parent of the agent's (agent-pi's, agent-ti's), so
    # it has to hold whatever a tool needs, or the tool disappears on calls, and
    # name every agent a call can reach, or that agent refuses its token. A call
    # reaches assistants, which draft in collab and never write directly, unless
    # the person let them act without asking (work:apply, which auth-server keeps
    # on a chain only while the person chooses it).
    actions: [agent:use, work:read, work:propose, work:act, work:apply, knowledge:read]
    audiences: [agent-pi, agent-ti, t10-collab, t10-knowledge, ai-gateway-tools, ai-gateway-llm]
  - name: agent-pi
    actions: [agent:use, work:read, work:propose, work:act, work:apply, knowledge:read]
    audiences: [agent-pi, t10-collab, t10-knowledge, ai-gateway-tools, ai-gateway-llm]
    # Where AUTH_TOOL_GATEWAY is on, its tokens are good only at the gateways.
    tool_audience: ai-gateway-tools
    # Its model calls carry the run's token, so ai-gateway-llm knows the tenant.
    model_audience: ai-gateway-llm
  # The Rust harness, serving the `ti` pool. Optional, as agent-ti is an
  # optional component: a deployment without it needs no account.
  - name: agent-ti
    optional: true
    # Ti, an assistant, drafts in collab (work:propose, work:act), and applies
    # without a draft where the person lets it (work:apply). work:write and
    # work:send serve agent teammates only: t10-collab's own write and send tools
    # serve only runs whose principal is an agent account.
    actions: [agent:use, work:read, work:propose, work:act, work:apply, work:write, work:send, knowledge:read]
    audiences: [agent-ti, t10-collab, t10-knowledge, ai-gateway-tools, ai-gateway-llm]
    tool_audience: ai-gateway-tools
    model_audience: ai-gateway-llm
  # Fires automations: it holds a person's standing grant, and makes one child
  # per firing for the harness it calls, through ai-gateway-agent, which has to
  # accept the firing's token. Its account exists only where setup has
  # T10_AUTOMATIONS_SECRET.
  - name: t10-automations
    optional: true
    # A person's automation runs an assistant, which drafts (work:propose,
    # work:act, and work:apply where the person lets it act without asking); an
    # agent account's runs a teammate (work:write, work:send).
    actions: [agent:use, work:read, work:propose, work:act, work:apply, work:write, work:send, knowledge:read]
    # agent-ti, for automations on ti, such as an agent teammate's intake.
    # t10-runner, so an external teammate's firing can be its parent.
    audiences: [ai-gateway, agent-pi, agent-ti, t10-runner, t10-collab, t10-knowledge, ai-gateway-tools, ai-gateway-llm]
  # External agent teammates: their runs happen on a runner outside t10, such
  # as a coding agent beside a repository. t10-automations holds this account
  # and mints each firing's tokens as it, so a runner never holds a secret of
  # auth-server's, only 5-minute tokens good at the tool gateway. No model
  # audience: the runner pays for its own model. Optional, as automations is.
  # See t10-agent-control's docs/external-teammates.md.
  - name: t10-runner
    optional: true
    actions: [work:read, work:write, work:send]
    audiences: [t10-runner, t10-collab, ai-gateway-tools]
    tool_audience: ai-gateway-tools

# Services that may exchange a run's token for one with another audience on
# its grant: the tool gateway, which forwards each tool call to its module with
# a token only that module accepts.
exchangers: [ai-gateway-tools]
