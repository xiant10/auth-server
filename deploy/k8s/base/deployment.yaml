apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-server
  labels:
    app.kubernetes.io/name: auth-server
    app.kubernetes.io/component: server
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-server
      app.kubernetes.io/component: server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-server
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: auth-server
      automountServiceAccountToken: false
      # 5s to leave the load balancers, then up to 10s for requests to finish.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          # Without this, a tainted node with no pods counts and blocks a rollout.
          nodeTaintsPolicy: Honor
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: auth-server
              app.kubernetes.io/component: server
        - maxSkew: 1
          nodeTaintsPolicy: Honor
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: auth-server
              app.kubernetes.io/component: server
      containers:
        - name: auth-server
          image: t10/auth-server
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: auth-server
            # Created by hand or by a secrets operator. See docs/deployment.md.
            - secretRef:
                name: auth-server
          env:
            # Below the memory limit, which Argon2 at 64 MiB a hash could reach.
            - name: GOMEMLIMIT
              value: 320MiB
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              # Sets GOMAXPROCS, and half of it is how many hashes run at once.
              cpu: "2"
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Migrations run before the server listens, and another replica may
          # hold their lock.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          # Doesn't touch the database, so an outage can't restart every pod.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          lifecycle:
            # Keep serving until endpoints stop sending traffic here.
            preStop:
              exec:
                command: ["sleep", "5"]
