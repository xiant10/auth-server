# Other workloads use http://auth-server.t10.svc.cluster.local:18000 for JWKS,
# tokens and grants. The issuer stays the public URL.
apiVersion: v1
kind: Service
metadata:
  name: auth-server
  labels:
    app.kubernetes.io/name: auth-server
spec:
  selector:
    app.kubernetes.io/name: auth-server
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 18000
      targetPort: http
